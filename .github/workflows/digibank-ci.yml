name: DigiBank CI SAST Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_PROJECT_NAME: ${{ secrets.SONAR_PROJECT_NAME }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

# ---------------------------------------------------------
# 1) BUILD JOB (must run first)
# ---------------------------------------------------------
jobs:
  build:
    name: Build DigiBank
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven validate
        run: mvn -B validate

      - name: Compile
        run: mvn -B clean compile

  # ---------------------------------------------------------
  # 2) PARALLEL SAST JOBS (all depend on build)
  # ---------------------------------------------------------

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B test -Dtest='!RunCucumberTest'

  cucumber-tests:
    name: Cucumber Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B test -Dtest='RunCucumberTest'

  jacoco:
    name: JaCoCo Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B jacoco:prepare-agent test jacoco:report

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-format json --report-path gitleaks-report.json

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: odc-data
          key: ${{ runner.os }}-odc-data
      - run: mvn -B org.owasp:dependency-check-maven:aggregate

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:spotbugs

  pmd:
    name: PMD Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B org.apache.maven.plugins:maven-pmd-plugin:pmd

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B org.apache.maven.plugins:maven-checkstyle-plugin:checkstyle

  pitest:
    name: PITest Mutation Testing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B clean test-compile org.pitest:pitest-maven:mutationCoverage

  # ---------------------------------------------------------
  # 3) SONARQUBE (must wait for ALL SAST jobs)
  # ---------------------------------------------------------
  sonar:
    name: SonarQube SAST + Quality Gate
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - cucumber-tests
      - jacoco
      - gitleaks
      - dependency-check
      - spotbugs
      - pmd
      - checkstyle
      - pitest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
      - run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectName="${{ secrets.SONAR_PROJECT_NAME }}"
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.qualitygate.wait=true

  # ---------------------------------------------------------
  # 4) DOCKER (only if SonarQube passes)
  # ---------------------------------------------------------
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: sonar
    if: needs.sonar.result == 'success'

    steps:
      - uses: actions/checkout@v4
      - run: docker build -t digibank-app:ci .

  # ---------------------------------------------------------
  # 5) TRIVY (only if Docker succeeds)
  # ---------------------------------------------------------
  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    needs: docker
    if: needs.docker.result == 'success'

    steps:
      - uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: digibank-app:ci
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
