name: DigiBank CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_PROJECT_NAME: ${{ secrets.SONAR_PROJECT_NAME }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

jobs:
  # 1) Build & packaging (no tests, no security scan, no analysis)
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build & package (skip tests)
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t digibank-app:ci .

  # 2) Unit tests (everything except the Cucumber suite)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run unit tests
        run: mvn -B test -Dtest='!RunCucumberTest' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/**'

  # 3) Cucumber (BDD) tests
  cucumber-tests:
    name: Cucumber Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run Cucumber tests
        run: mvn -B test -Dtest='RunCucumberTest' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Cucumber test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-test-reports
          path: '**/target/surefire-reports/**'

  # 4) OWASP Dependency-Check (SCA)
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: odc-data
          key: ${{ runner.os }}-odc-data
          restore-keys: ${{ runner.os }}-odc-data

      - name: Run OWASP Dependency-Check (aggregate report)
        run: mvn -B org.owasp:dependency-check-maven:aggregate

      - name: Upload OWASP Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*

  # 5) PITest mutation testing
  pitest:
    name: PITest Mutation Testing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run PITest mutation coverage
        run: mvn -B clean test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PITest Mutation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          path: '**/target/pit-reports/**'

  # 6) SonarQube analysis (runs last, consumes OWASP + PITest reports)
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests, cucumber-tests, owasp, pitest]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better SonarQube blame/relevancy

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compile sources for analysis
        run: mvn -B clean test-compile

      - name: Download OWASP Dependency-Check reports
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-reports
          path: target

      - name: Download PITest reports
        uses: actions/download-artifact@v4
        with:
          name: pitest-reports
          path: .

      - name: Run SonarQube analysis
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -DSONAR_PROJECT_NAME="${{ secrets.SONAR_PROJECT_NAME }}"
          -DSONAR_TOKEN=${{ secrets.SONAR_TOKEN }}
          -DSONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }}
